# Prometheus scrape config for the core nodes.
# Each core node serves /metrics on CLUSTER_PORT_BASE + nodeId x CLUSTER_PORT_STRIDE + 6 (ClusterConfig.nodeEndpointPort).
# The targets are the single-host layout (base 9300, stride 100); one member per host (stride 0) serves :9306 everywhere.
# Loopback-only by design: run Prometheus on the same box or tunnel; never expose these ports publicly.
global:
  scrape_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: core-nodes           # cluster-kit NodeEndpoint: /metrics, /health, /ready
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9306', 'localhost:9406', 'localhost:9506']
